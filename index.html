<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhishGuard-TR | Akıllı Oltalama Tespit Platformu</title>
    <style>
        :root {
            --bg-color: #0b132b;
            --card-bg: rgba(28, 37, 65, 0.85);
            --text-color: #edf2f4;
            --subtext-color: #8d99ae;
            --border-color: #3a506b;
            --input-bg: rgba(11, 19, 43, 0.7);
            --primary: #00b4d8;
        }

        .light-mode {
            --bg-color: #f8fafc;
            --card-bg: rgba(255, 255, 255, 0.9);
            --text-color: #0f172a;
            --subtext-color: #64748b;
            --border-color: #cbd5e1;
            --input-bg: #f1f5f9;
            --primary: #0284c7;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; transition: all 0.25s ease; }
        
        body { 
            background: var(--bg-color); 
            background-image: radial-gradient(circle at 50% 0%, rgba(0, 180, 216, 0.15), transparent 70%);
            color: var(--text-color); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px; 
        }

        .container { 
            background: var(--card-bg); 
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 20px; 
            padding: 35px; 
            width: 100%; 
            max-width: 720px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 20px rgba(0, 180, 216, 0.1); 
            border: 1px solid var(--border-color); 
            position: relative;
        }
        
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        h1 { margin: 0; color: var(--primary); font-size: 30px; font-weight: 800; letter-spacing: -0.5px; }
        
        .theme-btn {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }
        .theme-btn:hover { border-color: var(--primary); transform: translateY(-2px); }

        p.subtitle { color: var(--subtext-color); font-size: 14px; margin-top: 0; margin-bottom: 25px; }
        
        /* CANLI İSTATİSTİK PANELSİ */
        .stats-bar {
            display: flex;
            justify-content: space-around;
            background: var(--input-bg);
            padding: 15px;
            border-radius: 14px;
            margin-bottom: 25px;
            border: 1px solid var(--border-color);
            text-align: center;
        }
        .stat-item { flex: 1; }
        .stat-num { font-size: 22px; font-weight: 800; color: var(--primary); }
        .stat-label { font-size: 11px; color: var(--subtext-color); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px; }

        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { 
            flex: 1; 
            background: var(--input-bg); 
            border: 1px solid var(--border-color); 
            color: var(--subtext-color); 
            padding: 12px; 
            border-radius: 10px; 
            cursor: pointer; 
            font-weight: 600; 
            font-size: 13px;
        }
        .tab-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); box-shadow: 0 4px 12px rgba(0, 180, 216, 0.3); }
        
        /* HAZIR TEST BUTONLARI */
        .test-buttons { display: flex; gap: 10px; margin-bottom: 20px; }
        .btn-test {
            flex: 1;
            background: var(--input-bg);
            color: var(--text-color);
            border: 1px dashed var(--border-color);
            padding: 10px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            font-weight: 600;
        }
        .btn-test:hover { border-color: var(--primary); background: rgba(0, 180, 216, 0.05); }

        label { font-size: 12px; color: var(--subtext-color); display: flex; justify-content: space-between; margin-bottom: 8px; font-weight: 700; }
        .clear-btn { color: var(--primary); cursor: pointer; text-decoration: underline; font-weight: normal; }

        textarea, input[type="text"] { 
            width: 100%; 
            background: var(--input-bg); 
            border: 1px solid var(--border-color); 
            color: var(--text-color); 
            padding: 14px; 
            border-radius: 10px; 
            margin-bottom: 20px; 
            font-size: 14px; 
            resize: vertical; 
        }
        textarea:focus, input[type="text"]:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 10px rgba(0, 180, 216, 0.2); }
        
        .btn-submit { 
            width: 100%; 
            background: var(--primary); 
            color: #fff; 
            border: none; 
            padding: 16px; 
            border-radius: 12px; 
            font-weight: 800; 
            cursor: pointer; 
            font-size: 16px; 
            box-shadow: 0 6px 20px rgba(0, 180, 216, 0.3);
        }
        .btn-submit:hover { transform: translateY(-2px); filter: brightness(1.1); }
        
        /* DİNAMİK SONUÇ KARTI */
        #resultCard { 
            margin-top: 25px; 
            padding: 25px; 
            border-radius: 14px; 
            display: none; 
            text-align: center; 
        }

        .SAFE { background: rgba(6, 95, 70, 0.4); color: #34d399; border: 1px solid #059669; }
        .WARNING { background: rgba(133, 77, 14, 0.4); color: #fde047; border: 1px solid #ca8a04; }
        .DANGER { background: rgba(153, 27, 27, 0.4); color: #fca5a5; border: 1px solid #dc2626; }
        
        .score-title { font-size: 28px; font-weight: 800; margin-bottom: 5px; }
        .status-msg { font-size: 16px; font-weight: 700; margin-bottom: 15px; }
        
        /* RİSK ÇUBUĞU */
        .progress-bar-bg {
            width: 100%;
            height: 10px;
            background: rgba(255,255,255,0.1);
            border-radius: 5px;
            overflow: hidden;
            margin-bottom: 15px;
        }
        .progress-bar-fill {
            height: 100%;
            width: 0%;
            transition: width 0.6s ease;
            border-radius: 5px;
        }

        .details-list { text-align: left; font-size: 13.5px; margin-top: 15px; padding-left: 20px; line-height: 1.6; }
        
        .action-btns { display: flex; gap: 10px; margin-top: 20px; justify-content: center; flex-wrap: wrap; }
        .btn-action {
            background: rgba(255,255,255,0.12);
            color: #fff;
            text-decoration: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.2);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-action:hover { background: rgba(255,255,255,0.25); transform: translateY(-1px); }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-top">
            <h1>🛡️ PhishGuard-TR</h1>
            <button class="theme-btn" onclick="toggleTheme()">🌙 / ☀️ Tema</button>
        </div>
        <p class="subtitle">TÜBİTAK Projesi — Akıllı Türkçe Oltalama & Link Tespit Platformu</p>

        <!-- Canlı İstatistik Paneli -->
        <div class="stats-bar">
            <div class="stat-item">
                <div class="stat-num" id="totalScanCount">142</div>
                <div class="stat-label">Toplam Tarama</div>
            </div>
            <div class="stat-item">
                <div class="stat-num" style="color:#fca5a5;" id="threatCount">48</div>
                <div class="stat-label">Yakalanan Tehdit</div>
            </div>
            <div class="stat-item">
                <div class="stat-num" style="color:#34d399;">%97.2</div>
                <div class="stat-label">Model Doğruluğu</div>
            </div>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('all', event)">Tümünü Tara</button>
            <button class="tab-btn" onclick="switchTab('url', event)">Sadece Link (URL)</button>
            <button class="tab-btn" onclick="switchTab('text', event)">SMS / E-Posta Metni</button>
        </div>

        <!-- Hızlı Test Butonları -->
        <div class="test-buttons">
            <button type="button" class="btn-test" onclick="loadSample('safe')">🟢 Örnek Güvenli İçerik Doldur</button>
            <button type="button" class="btn-test" onclick="loadSample('danger')">🔴 Örnek Sahte/Oltalama Doldur</button>
        </div>

        <div id="urlSection">
            <label>
                <span>ŞÜPHELİ URL / LINK:</span>
                <span class="clear-btn" onclick="clearInput('urlInput')">Temizle</span>
            </label>
            <input type="text" id="urlInput" placeholder="Örn: https://turkiye-gov-tr-giris.com">
        </div>

        <div id="textSection">
            <label>
                <span>SMS, GMAIL VEYA MESAJ METNİ:</span>
                <span class="clear-btn" onclick="clearInput('textInput')">Temizle</span>
            </label>
            <textarea id="textInput" rows="4" placeholder="Örn: Hesabınız askıya alınmıştır, hemen güncellemek için tıklayın..."></textarea>
        </div>

        <button class="btn-submit" onclick="analyzeContent()">SİSTEMİ ÇALIŞTIR VE TARA</button>

        <!-- Sonuç Kartı -->
        <div id="resultCard">
            <div class="score-title" id="scoreText">Risk Skoru: %0</div>
            
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressBar"></div>
            </div>

            <div class="status-msg" id="statusMsg">Durum Bekleniyor...</div>
            <ul class="details-list" id="detailsList"></ul>
            
            <div class="action-btns">
                <a href="#" id="waBtn" class="btn-action" target="_blank" style="display:none; background:#25d366;">
                    💬 WhatsApp ile Uyar
                </a>
                <button onclick="downloadReport()" class="btn-action">
                    📥 Raporu İndir (.txt)
                </button>
            </div>
        </div>
    </div>

    <script>
        let totalScans = 142;
        let threatScans = 48;
        let lastReportText = "";

        const SUSPICIOUS_WORDS = [
            "hesabınız", "askıya", "güncelleyin", "tebrikler", "kazandınız", 
            "şifre", "doğrulayın", "tıklayın", "e-devlet", "aidat", "iade", 
            "kargonuz", "teslim", "icra", "ceza", "fatura", "odul", "hediye", "bakiye"
        ];

        const OFFICIAL_DOMAINS = ["turkiye.gov.tr", "egm.gov.tr", "gib.gov.tr", "ptt.gov.tr", "ziraatbank.com.tr"];

        function toggleTheme() {
            document.body.classList.toggle("light-mode");
        }

        function clearInput(id) {
            document.getElementById(id).value = "";
        }

        function loadSample(type) {
            const urlInput = document.getElementById("urlInput");
            const textInput = document.getElementById("textInput");

            if(type === 'safe') {
                urlInput.value = "https://www.turkiye.gov.tr";
                textInput.value = "Sayın vatandaşımız, e-Devlet Kapısı üzerinden randevu talebiniz başarıyla oluşturulmuştur.";
            } else {
                urlInput.value = "https://turkiye-gov-tr-giris-aidat.com";
                textInput.value = "Tebrikler! Birikmiş kart aidat iadenizi hemen almak ve hesabınızı doğrulamak için tıklayın:";
            }
        }

        function switchTab(type, evt) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            evt.target.classList.add('active');

            const urlSec = document.getElementById('urlSection');
            const textSec = document.getElementById('textSection');

            if (type === 'url') {
                urlSec.style.display = 'block';
                textSec.style.display = 'none';
            } else if (type === 'text') {
                urlSec.style.display = 'none';
                textSec.style.display = 'block';
            } else {
                urlSec.style.display = 'block';
                textSec.style.display = 'block';
            }
        }

        function analyzeContent() {
            const url = document.getElementById("urlInput").value.toLowerCase().trim();
            const text = document.getElementById("textInput").value.toLowerCase().trim();
            const resultCard = document.getElementById("resultCard");
            const scoreText = document.getElementById("scoreText");
            const statusMsg = document.getElementById("statusMsg");
            const detailsList = document.getElementById("detailsList");
            const progressBar = document.getElementById("progressBar");
            const waBtn = document.getElementById("waBtn");

            if (!url && !text) {
                alert("Lütfen analiz için en az bir link veya metin girin!");
                return;
            }

            totalScans++;
            document.getElementById("totalScanCount").innerText = totalScans;

            let riskScore = 0;
            let reasons = [];

            if (text) {
                let matchedWords = [];
                SUSPICIOUS_WORDS.forEach(word => {
                    if (text.includes(word)) matchedWords.push(word);
                });

                if (matchedWords.length > 0) {
                    let textRisk = Math.min(matchedWords.length * 25, 75);
                    riskScore += textRisk;
                    reasons.push(`Oltalama şüphesi taşıyan kelimeler tespit edildi: <strong>${matchedWords.join(", ")}</strong>`);
                }
            }

            if (url) {
                if (url.startsWith("http://")) {
                    riskScore += 20;
                    reasons.push("Bağlantı SSL şifreleme sertifikasına (HTTPS) sahip değil.");
                }

                const brandKeywords = ["turkiye", "edevlet", "banka", "gib-gov", "ptt-kargo"];
                let matchedBrand = brandKeywords.find(brand => url.includes(brand));
                let isOfficial = OFFICIAL_DOMAINS.some(official => url.endsWith(official));

                if (matchedBrand && !isOfficial) {
                    riskScore += 65;
                    reasons.push(`<strong>Typosquatting (Harf Oyunu) Tespit Edildi:</strong> Girilen adres orijinal <u>${matchedBrand}.gov.tr</u> adresi değildir! Adresin sonuna kelime eklenerek oluşturulmuş sahte bir tuzaktır.`);
                }
            }

            riskScore = Math.min(Math.max(riskScore, 0), 100);

            resultCard.style.display = "block";
            detailsList.innerHTML = "";
            progressBar.style.width = riskScore + "%";

            if (riskScore >= 70) {
                threatScans++;
                document.getElementById("threatCount").innerText = threatScans;

                resultCard.className = "DANGER";
                progressBar.style.background = "#dc2626";
                scoreText.innerText = `Risk Skoru: %${riskScore}`;
                statusMsg.innerText = "🔴 TEHLİKELİ: Bu içerik yüksek ihtimalle oltalama dolandırıcılığıdır!";

                let waMessage = encodeURIComponent(`🚨 UYARI! Şu link/SMS sahte çıktı, sakın tıklamayın:\n${url || text}\n\n🛡️ PhishGuard-TR ile analiz edildi.`);
                waBtn.href = `https://api.whatsapp.com/send?text=${waMessage}`;
                waBtn.style.display = "inline-flex";

            } else if (riskScore >= 30) {
                resultCard.className = "WARNING";
                progressBar.style.background = "#ca8a04";
                scoreText.innerText = `Risk Skoru: %${riskScore}`;
                statusMsg.innerText = "🟡 ORTA RİSK: Şüpheli ifadeler içeriyor, dikkatli olun.";
                waBtn.style.display = "none";
            } else {
                resultCard.className = "SAFE";
                progressBar.style.background = "#059669";
                scoreText.innerText = `Risk Skoru: %${riskScore}`;
                statusMsg.innerText = "🟢 DÜŞÜK RİSK: Belirgin bir tehdit kalıbı bulunamadı.";
                waBtn.style.display = "none";
            }

            if (reasons.length > 0) {
                reasons.forEach(r => {
                    let li = document.createElement("li");
                    li.innerHTML = r;
                    detailsList.appendChild(li);
                });
            } else {
                detailsList.innerHTML = "<li>Metin veya bağlantı şüpheli kural süzgeçlerinden temiz geçti.</li>";
            }

            lastReportText = `PHISHGUARD-TR GÜVENLİK RAPORU\n-----------------------------\nTarih: ${new Date().toLocaleString()}\nIncelenen URL: ${url || "Yok"}\nIncelenen Metin: ${text || "Yok"}\nRisk Skoru: %${riskScore}\nDurum: ${statusMsg.innerText}`;
        }

        function downloadReport() {
            if(!lastReportText) return;
            const blob = new Blob([lastReportText], { type: "text/plain;charset=utf-8" });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = "PhishGuard_Guvenlik_Raporu.txt";
            link.click();
        }
    </script>
</body>
</html>
