<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhishGuard-TR | Akıllı Türkçe Oltalama & Link Tespit Platformu</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { 
            background: #0f172a; 
            color: #f8fafc; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px; 
        }
        .container { 
            background: #1e293b; 
            border-radius: 16px; 
            padding: 30px; 
            width: 100%; 
            max-width: 650px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); 
            border: 1px solid #334155; 
        }
        h1 { margin-top: 0; color: #38bdf8; text-align: center; font-size: 28px; }
        p.subtitle { text-align: center; color: #94a3b8; font-size: 14px; margin-bottom: 25px; }
        
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { 
            flex: 1; 
            background: #0f172a; 
            border: 1px solid #334155; 
            color: #94a3b8; 
            padding: 10px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: 600; 
            transition: 0.2s; 
        }
        .tab-btn.active { background: #0284c7; color: white; border-color: #0284c7; }
        
        label { font-size: 12px; color: #cbd5e1; display: block; margin-bottom: 6px; font-weight: 600; }
        textarea, input[type="text"] { 
            width: 100%; 
            background: #0f172a; 
            border: 1px solid #475569; 
            color: #fff; 
            padding: 12px; 
            border-radius: 8px; 
            margin-bottom: 15px; 
            font-size: 14px; 
            resize: vertical; 
        }
        textarea:focus, input[type="text"]:focus { outline: none; border-color: #38bdf8; }
        
        .btn-submit { 
            width: 100%; 
            background: #0284c7; 
            color: white; 
            border: none; 
            padding: 14px; 
            border-radius: 8px; 
            font-weight: bold; 
            cursor: pointer; 
            font-size: 16px; 
            transition: background 0.2s; 
        }
        .btn-submit:hover { background: #0369a1; }
        
        #resultCard { 
            margin-top: 20px; 
            padding: 20px; 
            border-radius: 10px; 
            display: none; 
            text-align: center; 
        }
        .SAFE { background: #065f46; color: #34d399; border: 1px solid #059669; }
        .WARNING { background: #854d0e; color: #fde047; border: 1px solid #ca8a04; }
        .DANGER { background: #991b1b; color: #fca5a5; border: 1px solid #dc2626; }
        
        .score-title { font-size: 26px; font-weight: bold; margin-bottom: 5px; }
        .status-msg { font-size: 16px; font-weight: 600; margin-bottom: 10px; }
        .details-list { text-align: left; font-size: 13px; margin-top: 10px; padding-left: 20px; opacity: 0.9; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🛡️ PhishGuard-TR</h1>
        <p class="subtitle">TÜBİTAK Projesi — Akıllı Türkçe Oltalama & Link Tespit Platformu</p>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('all')">Tümünü Tara</button>
            <button class="tab-btn" onclick="switchTab('url')">Sadece Link (URL)</button>
            <button class="tab-btn" onclick="switchTab('text')">SMS / E-Posta Metni</button>
        </div>

        <div id="urlSection">
            <label>ŞÜPHELİ URL / LINK:</label>
            <input type="text" id="urlInput" placeholder="Örn: https://turkiye-gov-tr-giris.com">
        </div>

        <div id="textSection">
            <label>SMS, GMAIL VEYA MESAJ METNİ:</label>
            <textarea id="textInput" rows="4" placeholder="Örn: Hesabınız askıya alınmıştır, hemen güncellemek için tıklayın..."></textarea>
        </div>

        <button class="btn-submit" onclick="analyzeContent()">SİSTEMİ ÇALIŞTIR VE TARA</button>

        <div id="resultCard">
            <div class="score-title" id="scoreText">Risk Skoru: %0</div>
            <div class="status-msg" id="statusMsg">Durum Bekleniyor...</div>
            <ul class="details-list" id="detailsList"></ul>
        </div>
    </div>

    <script>
        // --- SİBER GÜVENLİK & TÜRKÇE NLP ANALİZ VERİLERİ ---
        const SUSPICIOUS_WORDS = [
            "hesabınız", "askıya", "güncelleyin", "tebrikler", "kazandınız", 
            "şifre", "doğrulayın", "tıklayın", "e-devlet", "aidat", "iade", 
            "kargonuz", "teslim", "icra", "ceza", "fatura", "odul", "hediye", "bakiye"
        ];

        const OFFICIAL_DOMAINS = ["turkiye.gov.tr", "egm.gov.tr", "gib.gov.tr", "ptt.gov.tr", "ziraatbank.com.tr"];

        function switchTab(type) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            const urlSec = document.getElementById('urlSection');
            const textSec = document.getElementById('textSection');

            if (type === 'url') {
                urlSec.style.display = 'block';
                textSec.style.display = 'none';
            } else if (type === 'text') {
                urlSec.style.display = 'none';
                textSec.style.display = 'block';
            } else {
                urlSec.style.display = 'block';
                textSec.style.display = 'block';
            }
        }

        function analyzeContent() {
            const url = document.getElementById("urlInput").value.toLowerCase().trim();
            const text = document.getElementById("textInput").value.toLowerCase().trim();
            const resultCard = document.getElementById("resultCard");
            const scoreText = document.getElementById("scoreText");
            const statusMsg = document.getElementById("statusMsg");
            const detailsList = document.getElementById("detailsList");

            if (!url && !text) {
                alert("Lütfen analiz için en az bir link veya metin girin!");
                return;
            }

            let riskScore = 0;
            let reasons = [];

            // 1. Metin Analizi (Kelime Taraması)
            if (text) {
                let matchedWords = [];
                SUSPICIOUS_WORDS.forEach(word => {
                    if (text.includes(word)) matchedWords.push(word);
                });

                if (matchedWords.length > 0) {
                    let textRisk = Math.min(matchedWords.length * 25, 75);
                    riskScore += textRisk;
                    reasons.push(`Oltalama şüphesi taşıyan kelimeler tespit edildi: <strong>${matchedWords.join(", ")}</strong>`);
                }
            }

            // 2. URL Analizi (Resmi Kurum Taklidi & Güvenlik)
            if (url) {
                if (url.startsWith("http://")) {
                    riskScore += 20;
                    reasons.push("Bağlantı SSL şifreleme sertifikasına (HTTPS) sahip değil.");
                }

                const brandKeywords = ["turkiye", "edevlet", "banka", "gib-gov", "ptt-kargo"];
                let isFakeDomain = brandKeywords.some(brand => url.includes(brand)) && 
                                   !OFFICIAL_DOMAINS.some(official => url.endsWith(official));

                if (isFakeDomain) {
                    riskScore += 65;
                    reasons.push("Resmi e-Devlet veya Banka taklidi sahte alan adı (Typosquatting) şüphesi!");
                }
            }

            // Skor Sınırlama (%0 - %100)
            riskScore = Math.min(Math.max(riskScore, 0), 100);

            // Sonuçları Ekran Kartına Bas
            resultCard.style.display = "block";
            detailsList.innerHTML = "";

            if (riskScore >= 70) {
                resultCard.className = "DANGER";
                scoreText.innerText = `Risk Skoru: %${riskScore}`;
                statusMsg.innerText = "🔴 TEHLİKELİ: Bu içerik yüksek ihtimalle oltalama dolandırıcılığıdır!";
            } else if (riskScore >= 30) {
                resultCard.className = "WARNING";
                scoreText.innerText = `Risk Skoru: %${riskScore}`;
                statusMsg.innerText = "🟡 ORTA RİSK: Şüpheli ifadeler içeriyor, dikkatli olun.";
            } else {
                resultCard.className = "SAFE";
                scoreText.innerText = `Risk Skoru: %${riskScore}`;
                statusMsg.innerText = "🟢 DÜŞÜK RİSK: Belirgin bir tehdit kalıbı bulunamadı.";
            }

            if (reasons.length > 0) {
                reasons.forEach(r => {
                    let li = document.createElement("li");
                    li.innerHTML = r;
                    detailsList.appendChild(li);
                });
            } else {
                detailsList.innerHTML = "<li>Metin veya bağlantı şüpheli kural süzgeçlerinden temiz geçti.</li>";
            }
        }
    </script>
</body>
</html>
