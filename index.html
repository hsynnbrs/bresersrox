<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhishGuard-TR | Akıllı Oltalama Tespit Platformu</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { 
            background: #0f172a; 
            color: #f8fafc; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px; 
        }
        .container { 
            background: #1e293b; 
            border-radius: 16px; 
            padding: 30px; 
            width: 100%; 
            max-width: 680px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); 
            border: 1px solid #334155; 
        }
        h1 { margin-top: 0; color: #38bdf8; text-align: center; font-size: 28px; margin-bottom: 5px; }
        p.subtitle { text-align: center; color: #94a3b8; font-size: 14px; margin-bottom: 20px; }
        
        /* 1. İSTATİSTİK PANELSİ (SAYAÇLAR) */
        .stats-bar {
            display: flex;
            justify-content: space-around;
            background: #0f172a;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 1px solid #334155;
            text-align: center;
        }
        .stat-item { flex: 1; }
        .stat-num { font-size: 20px; font-weight: bold; color: #38bdf8; }
        .stat-label { font-size: 11px; color: #94a3b8; text-transform: uppercase; }

        .tabs { display: flex; gap: 10px; margin-bottom: 15px; }
        .tab-btn { 
            flex: 1; 
            background: #0f172a; 
            border: 1px solid #334155; 
            color: #94a3b8; 
            padding: 10px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: 600; 
            transition: 0.2s; 
        }
        .tab-btn.active { background: #0284c7; color: white; border-color: #0284c7; }
        
        /* 2. HAZIR TEST BUTONLARI */
        .test-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .btn-test {
            flex: 1;
            background: #334155;
            color: #cbd5e1;
            border: none;
            padding: 8px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-test:hover { background: #475569; color: #fff; }
        .btn-test.danger-test:hover { background: #991b1b; }

        label { font-size: 12px; color: #cbd5e1; display: block; margin-bottom: 6px; font-weight: 600; }
        textarea, input[type="text"] { 
            width: 100%; 
            background: #0f172a; 
            border: 1px solid #475569; 
            color: #fff; 
            padding: 12px; 
            border-radius: 8px; 
            margin-bottom: 15px; 
            font-size: 14px; 
            resize: vertical; 
        }
        textarea:focus, input[type="text"]:focus { outline: none; border-color: #38bdf8; }
        
        .btn-submit { 
            width: 100%; 
            background: #0284c7; 
            color: white; 
            border: none; 
            padding: 14px; 
            border-radius: 8px; 
            font-weight: bold; 
            cursor: pointer; 
            font-size: 16px; 
            transition: background 0.2s; 
        }
        .btn-submit:hover { background: #0369a1; }
        
        #resultCard { 
            margin-top: 20px; 
            padding: 20px; 
            border-radius: 10px; 
            display: none; 
            text-align: center; 
        }
        .SAFE { background: #065f46; color: #34d399; border: 1px solid #059669; }
        .WARNING { background: #854d0e; color: #fde047; border: 1px solid #ca8a04; }
        .DANGER { background: #991b1b; color: #fca5a5; border: 1px solid #dc2626; }
        
        .score-title { font-size: 26px; font-weight: bold; margin-bottom: 5px; }
        .status-msg { font-size: 16px; font-weight: 600; margin-bottom: 10px; }
        .details-list { text-align: left; font-size: 13px; margin-top: 10px; padding-left: 20px; opacity: 0.95; }
        
        /* 3. WHATSAPP PAYLAŞIM BUTONU */
        .btn-whatsapp {
            display: none;
            margin-top: 15px;
            background: #25d366;
            color: white;
            text-decoration: none;
            padding: 10px 15px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-whatsapp:hover { background: #1da851; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🛡️ PhishGuard-TR</h1>
        <p class="subtitle">TÜBİTAK Projesi — Akıllı Türkçe Oltalama & Link Tespit Platformu</p>

        <!-- Canlı İstatistik Paneli -->
        <div class="stats-bar">
            <div class="stat-item">
                <div class="stat-num" id="totalScanCount">128</div>
                <div class="stat-label">Toplam Tarama</div>
            </div>
            <div class="stat-item">
                <div class="stat-num" style="color:#fca5a5;" id="threatCount">42</div>
                <div class="stat-label">Yakalanan Tehdit</div>
            </div>
            <div class="stat-item">
                <div class="stat-num" style="color:#34d399;">%96.4</div>
                <div class="stat-label">Model Doğruluğu</div>
            </div>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('all', event)">Tümünü Tara</button>
            <button class="tab-btn" onclick="switchTab('url', event)">Sadece Link (URL)</button>
            <button class="tab-btn" onclick="switchTab('text', event)">SMS / E-Posta Metni</button>
        </div>

        <!-- Hızlı Test Butonları -->
        <div class="test-buttons">
            <button type="button" class="btn-test" onclick="loadSample('safe')">🟢 Örnek Güvenli SMS Yükle</button>
            <button type="button" class="btn-test danger-test" onclick="loadSample('danger')">🔴 Örnek Sahte/Oltalama Yükle</button>
        </div>

        <div id="urlSection">
            <label>ŞÜPHELİ URL / LINK:</label>
            <input type="text" id="urlInput" placeholder="Örn: https://turkiye-gov-tr-giris.com">
        </div>

        <div id="textSection">
            <label>SMS, GMAIL VEYA MESAJ METNİ:</label>
            <textarea id="textInput" rows="4" placeholder="Örn: Hesabınız askıya alınmıştır, hemen güncellemek için tıklayın..."></textarea>
        </div>

        <button class="btn-submit" onclick="analyzeContent()">SİSTEMİ ÇALIŞTIR VE TARA</button>

        <!-- Sonuç Kartı -->
        <div id="resultCard">
            <div class="score-title" id="scoreText">Risk Skoru: %0</div>
            <div class="status-msg" id="statusMsg">Durum Bekleniyor...</div>
            <ul class="details-list" id="detailsList"></ul>
            
            <!-- WhatsApp Uyarı Butonu -->
            <a href="#" id="waBtn" class="btn-whatsapp" target="_blank">
                💬 Yakalanan Bu Tehdidi WhatsApp'tan Sevdiklerinle Paylaş
            </a>
        </div>
    </div>

    <script>
        let totalScans = 128;
        let threatScans = 42;

        const SUSPICIOUS_WORDS = [
            "hesabınız", "askıya", "güncelleyin", "tebrikler", "kazandınız", 
            "şifre", "doğrulayın", "tıklayın", "e-devlet", "aidat", "iade", 
            "kargonuz", "teslim", "icra", "ceza", "fatura", "odul", "hediye", "bakiye"
        ];

        const OFFICIAL_DOMAINS = ["turkiye.gov.tr", "egm.gov.tr", "gib.gov.tr", "ptt.gov.tr", "ziraatbank.com.tr"];

        // Test Örneklerini Kutulara Yükleme Fonksiyonu
        function loadSample(type) {
            const urlInput = document.getElementById("urlInput");
            const textInput = document.getElementById("textInput");

            if(type === 'safe') {
                urlInput.value = "https://www.turkiye.gov.tr";
                textInput.value = "Sayın vatandaşımız, e-Devlet Kapısı üzerinden randevu talebiniz başarıyla oluşturulmuştur.";
            } else {
                urlInput.value = "https://turkiye-gov-tr-giris-aidat.com";
                textInput.value = "Tebrikler! Birikmiş kart aidat iadenizi hemen almak ve hesabınızı doğrulamak için tıklayın:";
            }
        }

        function switchTab(type, evt) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            evt.target.classList.add('active');

            const urlSec = document.getElementById('urlSection');
            const textSec = document.getElementById('textSection');

            if (type === 'url') {
                urlSec.style.display = 'block';
                textSec.style.display = 'none';
            } else if (type === 'text') {
                urlSec.style.display = 'none';
                textSec.style.display = 'block';
            } else {
                urlSec.style.display = 'block';
                textSec.style.display = 'block';
            }
        }

        function analyzeContent() {
            const url = document.getElementById("urlInput").value.toLowerCase().trim();
            const text = document.getElementById("textInput").value.toLowerCase().trim();
            const resultCard = document.getElementById("resultCard");
            const scoreText = document.getElementById("scoreText");
            const statusMsg = document.getElementById("statusMsg");
            const detailsList = document.getElementById("detailsList");
            const waBtn = document.getElementById("waBtn");

            if (!url && !text) {
                alert("Lütfen analiz için en az bir link veya metin girin!");
                return;
            }

            // Sayaçları Güncelle
            totalScans++;
            document.getElementById("totalScanCount").innerText = totalScans;

            let riskScore = 0;
            let reasons = [];

            // 1. Türkçe Metin Analizi (NLP)
            if (text) {
                let matchedWords = [];
                SUSPICIOUS_WORDS.forEach(word => {
                    if (text.includes(word)) matchedWords.push(word);
                });

                if (matchedWords.length > 0) {
                    let textRisk = Math.min(matchedWords.length * 25, 75);
                    riskScore += textRisk;
                    reasons.push(`Oltalama şüphesi taşıyan kelimeler tespit edildi: <strong>${matchedWords.join(", ")}</strong>`);
                }
            }

            // 2. Typosquatting ve URL Analizi
            if (url) {
                if (url.startsWith("http://")) {
                    riskScore += 20;
                    reasons.push("Bağlantı SSL şifreleme sertifikasına (HTTPS) sahip değil.");
                }

                const brandKeywords = ["turkiye", "edevlet", "banka", "gib-gov", "ptt-kargo"];
                let matchedBrand = brandKeywords.find(brand => url.includes(brand));
                let isOfficial = OFFICIAL_DOMAINS.some(official => url.endsWith(official));

                if (matchedBrand && !isOfficial) {
                    riskScore += 65;
                    reasons.push(`<strong>Typosquatting (Harf Oyunu) Tespit Edildi:</strong> Girilen adres orijinal <u>${matchedBrand}.gov.tr</u> adresi değildir! Adresin sonuna kelime eklenerek oluşturulmuş sahte bir tuzaktır.`);
                }
            }

            // Skor Sınırlama
            riskScore = Math.min(Math.max(riskScore, 0), 100);

            // Sonuç Ekranı
            resultCard.style.display = "block";
            detailsList.innerHTML = "";

            if (riskScore >= 70) {
                threatScans++;
                document.getElementById("threatCount").innerText = threatScans;

                resultCard.className = "DANGER";
                scoreText.innerText = `Risk Skoru: %${riskScore}`;
                statusMsg.innerText = "🔴 TEHLİKELİ: Bu içerik yüksek ihtimalle oltalama dolandırıcılığıdır!";

                // WhatsApp Butonunu Hazırla
                let waMessage = encodeURIComponent(`🚨 UYARI! Şu link/SMS sahte çıktı, sakın tıklamayın:\n${url || text}\n\n🛡️ PhishGuard-TR ile analiz edildi.`);
                waBtn.href = `https://api.whatsapp.com/send?text=${waMessage}`;
                waBtn.style.display = "inline-flex";

            } else if (riskScore >= 30) {
                resultCard.className = "WARNING";
                scoreText.innerText = `Risk Skoru: %${riskScore}`;
                statusMsg.innerText = "🟡 ORTA RİSK: Şüpheli ifadeler içeriyor, dikkatli olun.";
                waBtn.style.display = "none";
            } else {
                resultCard.className = "SAFE";
                scoreText.innerText = `Risk Skoru: %${riskScore}`;
                statusMsg.innerText = "🟢 DÜŞÜK RİSK: Belirgin bir tehdit kalıbı bulunamadı.";
                waBtn.style.display = "none";
            }

            if (reasons.length > 0) {
                reasons.forEach(r => {
                    let li = document.createElement("li");
                    li.innerHTML = r;
                    detailsList.appendChild(li);
                });
            } else {
                detailsList.innerHTML = "<li>Metin veya bağlantı şüpheli kural süzgeçlerinden temiz geçti.</li>";
            }
        }
    </script>
</body>
</html>
